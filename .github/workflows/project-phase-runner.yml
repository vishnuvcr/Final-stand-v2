name: Project phase runner
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: true
        default: "main"
jobs:
  phase-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve ref
        id: ref
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.head_ref }}" ]; then
            echo "ref=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke-test dependencies
        run: python -m pip install --upgrade pip pandas pyarrow requests
      - name: Run phase-1 smoke test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/inspect_sources.py
      - name: Upload smoke-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-phase-runner-smoke
          path: research_artifacts/phase1-smoke
