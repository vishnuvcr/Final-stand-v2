name: Phase 2 - Monte Carlo signal

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy huggingface_hub hf_xet
      - uses: actions/cache@v4
        with:
          path: data_cache/hf_nifty
          key: hf-nifty-options-v1-${{ runner.os }}
          restore-keys: |
            hf-nifty-options-v1-
      - name: Run Monte Carlo signal generation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/run_phase2_signal.py
      - name: Commit phase-2 artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_artifacts/phase2
          git add data_cache/hf_nifty/.cache/huggingface 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "phase2: record Monte Carlo signal results [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
