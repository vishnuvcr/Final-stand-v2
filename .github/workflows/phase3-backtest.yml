name: Phase 3 - Strategy backtest

on:
  push:
    branches: [phase-3-backtest]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy huggingface_hub hf_xet
      - uses: actions/cache@v4
        with:
          path: data_cache/hf_nifty
          key: hf-nifty-options-v1-${{ runner.os }}
          restore-keys: |
            hf-nifty-options-v1-
      - name: Run strategy backtest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/run_phase3_backtest.py
      - name: Commit phase-3 artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_artifacts/phase3
          git diff --cached --quiet && exit 0
          git commit -m "phase3: record strategy backtest results [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}