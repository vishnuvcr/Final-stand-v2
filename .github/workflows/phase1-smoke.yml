name: Phase 1 - Data smoke test
on:
  workflow_dispatch:
  push:
    branches: [phase-1-data-spec]
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow requests
      - name: Inspect source files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/inspect_sources.py
      - name: Upload smoke-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase1-smoke-test
          path: research_artifacts/phase1-smoke
