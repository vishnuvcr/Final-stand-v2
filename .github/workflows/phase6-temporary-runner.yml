name: Phase 6 temporary runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-6-direction-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy scipy scikit-learn matplotlib huggingface_hub hf_xet xgboost
      - uses: actions/cache@v4
        with:
          path: data_cache/hf_nifty
          key: hf-nifty-options-v1-${{ runner.os }}
          restore-keys: |
            hf-nifty-options-v1-
      - name: Run phase 6
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/run_phase6_direction_engine.py
      - name: Commit results to phase 6 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_artifacts/phase6
          git diff --cached --quiet && exit 0
          git commit -m "phase6: record executable results [skip ci]"
          git push origin HEAD:phase-6-direction-engine
