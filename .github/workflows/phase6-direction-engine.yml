name: Phase 6 - Direction engine v2

on:
  push:
    branches: [phase-6-direction-engine]
    paths:
      - '.github/workflows/phase6-direction-engine.yml'
      - 'scripts/**'
      - 'research_artifacts/phase2/**'
      - 'research_artifacts/phase3/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direction-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy scipy scikit-learn matplotlib huggingface_hub hf_xet xgboost
      - uses: actions/cache@v4
        with:
          path: data_cache/hf_nifty
          key: hf-nifty-options-v1-${{ runner.os }}
          restore-keys: |
            hf-nifty-options-v1-
      - name: Run Phase 6 direction engine
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/run_phase6_direction_engine.py
      - name: Commit Phase 6 artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_artifacts/phase6
          git diff --cached --quiet && exit 0
          git commit -m "phase6: record direction-engine artifacts [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
